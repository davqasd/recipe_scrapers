AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "tmp/**/*"
    - "spec/cassettes/**/*"
    - "gemfiles/**/*"
    - "lib/recipe_scrapers/sites/**/*"
    - "vendor/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/DotPosition:
  EnforcedStyle: trailing

Style/Documentation:
  Enabled: false

Gemspec/RequireMFA:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent

Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

Layout/LineLength:
  Exclude:
    - "spec/sites/**/*"
