        class=\"wprm-recipe-instruction-group\"><ul class=\"wprm-recipe-instructions\"><li
        id=\"wprm-recipe-26534-step-0-0\" class=\"wprm-recipe-instruction\" style=\"list-style-type:
        decimal;\"><div class=\"wprm-recipe-instruction-text\" style=\"margin-bottom:
        5px;\"><span style=\"display: block;\"><strong>Prepare the Ingredients</strong>:
        Gather fresh raspberries, ice cubes, sweetener of choice, and water.</span></div></li><li
        id=\"wprm-recipe-26534-step-0-1\" class=\"wprm-recipe-instruction\" style=\"list-style-type:
        decimal;\"><div class=\"wprm-recipe-instruction-text\" style=\"margin-bottom:
        5px;\"><span style=\"display: block;\"><strong>Blend</strong>: Place all ingredients
        in a blender and blend until liquefied.</span></div></li><li id=\"wprm-recipe-26534-step-0-2\"
        class=\"wprm-recipe-instruction\" style=\"list-style-type: decimal;\"><div
        class=\"wprm-recipe-instruction-text\" style=\"margin-bottom: 5px;\"><span
        style=\"display: block;\"><strong>Taste and Adjust:</strong>&nbsp;Taste your
        raspberry juice and adjust sweetener, if needed. Add more water for a thinner
        consistency or more ice or frozen raspberries for a thicker consistency.</span></div></li><li
        id=\"wprm-recipe-26534-step-0-3\" class=\"wprm-recipe-instruction\" style=\"list-style-type:
        decimal;\"><div class=\"wprm-recipe-instruction-text\" style=\"margin-bottom:
        5px;\"><span style=\"display: block;\"><strong>Serve</strong>: Pour the juice
        into glasses. For an extra touch of flavor, add a sprig of mint and a squeeze
        of lime to each glass. If you prefer, you can blend the mint and lime juice
        directly into the juice.</span></div></li></ul></div></div>\n<div id=\"recipe-video\"></div>\n<div
