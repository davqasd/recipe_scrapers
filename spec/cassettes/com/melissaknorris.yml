        wprm-align-left wprm-header-decoration-line\" style=\"\" id=\"notes\">Notes<div
        class=\"wprm-decoration-line\" style=\"border-color: #e0e0e0;\"></div></h3><div
        class=\"wprm-recipe-notes\"><ul data-slot-rendered-content=\"true\">\n<li><strong>Adjust
        Sweetness</strong>: Raspberries can be tart, so adjust the sweetness to your
        liking. Honey is a natural sweetener, but you can also experiment with other
        options like maple syrup or stevia.</li>\n<li><strong>Minty Fresh</strong>:
        While my kids prefer their juice without mint, I love the refreshing hint
        it adds. You can either add a sprig of mint to the glass or blend it directly
        into the juice.</li>\n<li><strong>Lemon Balm</strong>: While I was out harvesting
        my raspberries, I grabbed a couple sprigs of lemon balm and added that to
        my raspberry juice. It made for a delightful citrus flavor!</li>\n</ul></div></div>\n<div
