        class=\"clearboth\"/><h2 class=\"recipe-h2\">ingredients</h2><p class=\"ml-30\"><span
        class=\"ft-verdana s18\"><span itemprop=\"recipeIngredient\">3 pounds boneless
        beef sirloin tip roast</span><br><span itemprop=\"recipeIngredient\">2 tablespoons
        vegetable oil</span><br><span itemprop=\"recipeIngredient\">4 large potatoes,
        peeled and quartered</span><br><span itemprop=\"recipeIngredient\">4 large
        carrots, cut into 2-inch pieces</span><br><span itemprop=\"recipeIngredient\">1
        large onion, cut into wedges</span><br><span itemprop=\"recipeIngredient\">2
        cups water</span><br><span itemprop=\"recipeIngredient\">1 teaspoon beef bouillon
        granules</span><br><span itemprop=\"recipeIngredient\">1/2 teaspoon salt</span><br><span
        itemprop=\"recipeIngredient\">1/4 teaspoon black pepper</span><br><span itemprop=\"recipeIngredient\">3
        tablespoons cornstarch</span><br><span itemprop=\"recipeIngredient\">3 tablespoons
        cold water</span><br></span></p><h2 class=\"recipe-h2\">directions</h2><div
        itemprop=\"recipeInstructions\" class=\"ft-verdana s18\"><p class=\"ml-30\">In
        a pressure cooker, brown roast in oil on all sides. Add potatoes, carrots,
        onion and water. <br><br> Close cover securely and place pressure regulator
        on vent pipe. Bring cooker to full pressure over high heat. Reduce heat to
        medium-high and cook for 40 minutes (Pressure regulator should maintain a
        slow steady rocking motion; adjust heat if needed). <br><br> Remove from the
        heat and allow pressure to drop on its own. Remove meat and vegetables and
        keep warm. <br><br> Bring cooking juices in pressure cooker to a boil. Add
        bouillon, salt and pepper. Combine cornstarch and cold water until smooth,
        then stir into juices. Bring to a boil, cook and stir for 2 minutes or until
        thickened. <br><br> Serve with roast and vegetables.</p></div><h2 class=\"recipe-h2\">added
        by</h2><p class=\"ml-30 ft-verdana s16\"><span class=\"s18\"><span itemprop=\"author\">Ilovevegas</span></span><br><p><br><h2
