        =============== This snippet of JavaScript handles fetching the dynamic recommendations
        from the remote recommendations server\nand then makes a call to render the
        configured template with the returned recommended products: =================
        -->\n\n<script>\n(function(){\n// window.CQuotient is provided on the page
        by the Analytics code:\nvar cq = window.CQuotient;\nvar dc = window.DataCloud;\nvar
        isCQ = false;\nvar isDC = false;\nif (cq && ('function' == typeof cq.getCQUserId)\n&&
        ('function' == typeof cq.getCQCookieId)\n&& ('function' == typeof cq.getCQHashedEmail)\n&&
        ('function' == typeof cq.getCQHashedLogin)) {\nisCQ = true;\n}\nif (dc &&
        ('function' == typeof dc.getDCUserId)) {\nisDC = true;\n}\nif (isCQ || isDC)
        {\nvar recommender = '[[&quot;viewed-recently&quot;]]';\nvar slotRecommendationType
        = decodeHtml('RECOMMENDATION');\n// removing any leading/trailing square brackets
        and escaped quotes:\nrecommender = recommender.replace(/\\[|\\]|&quot;/g,
        '');\nvar separator = '|||';\nvar slotConfigurationUUID = '4727b531bde9c6dd15d05f6399';\nvar
        contextAUID = decodeHtml('');\nvar contextSecondaryAUID = decodeHtml('');\nvar
        contextAltAUID = decodeHtml('');\nvar contextType = decodeHtml('');\nvar anchorsArray
        = [];\nvar contextAUIDs = contextAUID.split(separator);\nvar contextSecondaryAUIDs
        = contextSecondaryAUID.split(separator);\nvar contextAltAUIDs = contextAltAUID.split(separator);\nvar
        contextTypes = contextType.split(separator);\nvar slotName = decodeHtml('mini-cart-recommendations');\nvar
        slotConfigId = decodeHtml('New Slot Configuration - 2025-08-20 15:04:47');\nvar
        slotConfigTemplate = decodeHtml('slots/recommendation/miniCartRecommendations.isml');\nif
        (contextAUIDs.length == contextSecondaryAUIDs.length) {\nfor (i = 0; i < contextAUIDs.length;
        i++) {\nanchorsArray.push({\nid: contextAUIDs[i],\nsku: contextSecondaryAUIDs[i],\ntype:
        contextTypes[i],\nalt_id: contextAltAUIDs[i]\n});\n}\n} else {\nanchorsArray
        = [{id: contextAUID, sku: contextSecondaryAUID, type: contextType, alt_id:
        contextAltAUID}];\n}\nvar urlToCall = '/on/demandware.store/Sites-GB-SharkNinja-Site/en_GB/CQRecomm-Start';\nvar
        params = null;\nif (isCQ) {\nparams = {\nuserId: cq.getCQUserId(),\ncookieId:
        cq.getCQCookieId(),\nemailId: cq.getCQHashedEmail(),\nloginId: cq.getCQHashedLogin(),\nanchors:
        anchorsArray,\nslotId: slotName,\nslotConfigId: slotConfigId,\nslotConfigTemplate:
        slotConfigTemplate,\nccver: '1.03'\n};\n}\n// console.log(\"Recommendation
        Type - \" + slotRecommendationType + \", Recommender Selected - \" + recommender);\nif
        (isDC && slotRecommendationType == 'DATA_CLOUD_RECOMMENDATION') {\n// Set
        DC variables for API call\ndcIndividualId = dc.getDCUserId();\ndcUrl = dc.getDCPersonalizationPath();\nif
        (dcIndividualId && dcUrl && dcIndividualId != '' && dcUrl != '') {\n// console.log(\"Fetching
        CDP Recommendations\");\nvar productRecs = {};\nproductRecs[recommender] =
        getCDPRecs(dcUrl, dcIndividualId, recommender);\ncb(productRecs);\n}\n} else
        if (isCQ && slotRecommendationType != 'DATA_CLOUD_RECOMMENDATION') {\nif (cq.getRecs)
        {\ncq.getRecs(cq.clientId, recommender, params, cb);\n} else {\ncq.widgets
        = cq.widgets || [];\ncq.widgets.push({\nrecommenderName: recommender,\nparameters:
        params,\ncallback: cb\n});\n}\n}\n};\nfunction decodeHtml(html) {\nvar txt
        = document.createElement(\"textarea\");\ntxt.innerHTML = html;\nreturn txt.value;\n}\nfunction
        cb(parsed) {\nvar arr = parsed[recommender].recs;\nif (arr && 0 < arr.length)
        {\nvar filteredProductIds = '';\nfor (i = 0; i < arr.length; i++) {\nfilteredProductIds
        = filteredProductIds + 'pid' + i + '=' + encodeURIComponent(arr[i].id) + '&';\n}\nfilteredProductIds
        = filteredProductIds.substring(0, filteredProductIds.length - 1);//to remove
        the trailing '&'\nvar formData = 'auid=' + encodeURIComponent(contextAUID)\n+
        '&scid=' + slotConfigurationUUID\n+ '&' + filteredProductIds;\nvar request
        = new XMLHttpRequest();\nrequest.open('POST', urlToCall, true);\nrequest.setRequestHeader('Content-type',
        'application/x-www-form-urlencoded');\nrequest.onreadystatechange = function()
        {\nif (this.readyState === 4) {\n// Got the product data from DW, showing
        the products now by changing the inner HTML of the DIV:\nvar divId = 'cq_recomm_slot-'
        + slotConfigurationUUID;\ndocument.getElementById(divId).innerHTML = this.responseText;\n//find
        and evaluate scripts in response:\nvar scripts = document.getElementById(divId).getElementsByTagName('script');\nif
        (null != scripts) {\nfor (var i=0;i<scripts.length;i++) {//not combining script
        snippets on purpose\nvar srcScript = document.createElement('script');\nsrcScript.text
        = scripts[i].innerHTML;\nsrcScript.asynch = scripts[i].asynch;\nsrcScript.defer
        = scripts[i].defer;\nsrcScript.type = scripts[i].type;\nsrcScript.charset
        = scripts[i].charset;\ndocument.head.appendChild( srcScript );\ndocument.head.removeChild(
        srcScript );\n}\n}\n}\n};\nrequest.send(formData);\nrequest = null;\n}\n};\n})();\n</script>\n<!--
