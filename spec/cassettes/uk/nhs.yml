        1125w,\n          https://assets.nhs.uk/campaigns-cms-prod/images/Apple_apricot__sultana_squares_7ubq6ki.width-1534.png
        1534w\n        \"\n        alt=\"Baked oat squares with piece of apple and
        apricot, and sultanas embedded\"\n      />\n    </figure>\n  </div>\n</div>\n<div
        class=\"bh-recipe-instructions\">\n  <div class=\"nhsuk-width-container\">\n
        \   <div class=\"nhsuk-grid-row\">\n      <div class=\"nhsuk-grid-column-one-third\">\n
        \         \n            <h2 data-block-key=\"mxbpn\">Ingredients</h2><ul><li
        data-block-key=\"pumh9\">100g lower-fat spread</li><li data-block-key=\"aujtv\">4
        tablespoons golden syrup</li><li data-block-key=\"dem6d\">250g high-fibre
        porridge oats</li><li data-block-key=\"a78ij\">1 apple, cored and chopped
        into small chunks</li><li data-block-key=\"53gls\">50g ready-to-eat apricots,
        chopped</li><li data-block-key=\"ac83i\">50g sultanas or raisins (or a mixture)</li><li
        data-block-key=\"3gh29\">half a teapsoon ground mixed spice (optional)</li><li
        data-block-key=\"19o57\">1 egg, beaten</li></ul>\n          \n      </div>\n
        \     <div class=\"nhsuk-grid-column-two-thirds bh-recipe-instructions__method\">\n
        \       <h2>Method</h2>\n        <ol>\n          \n            \n\n<li>\n
        \ \n    <p data-block-key=\"bvirt\">Preheat the oven to 180C (fan 160C, gas
        mark 4). Grease a 23cm (9-inch) shallow square cake tin with a little reduced-fat
        spread, then line the base with baking parchment or greaseproof paper.</p>\n
        \ \n</li>\n          \n            \n\n<li>\n  \n    <p data-block-key=\"dy2nz\">Melt
        the remaining spread in a large saucepan with the golden syrup. Take care
        that the mixture doesn&#x27;t get too hot.</p>\n  \n</li>\n          \n            \n\n<li>\n
        \ \n    <p data-block-key=\"zs4ef\">Remove the pan from the heat and add the
        porridge oats, apple, apricots, sultanas (or raisins) and mixed spice (if
        using). Stir well.</p>\n  \n    <div class=\"nhsuk-inset-text\">\n  <span
        class=\"nhsuk-u-visually-hidden\">Information: </span>\n  <p data-block-key=\"wf78j\">If
        you have a microwave, you can melt the spread and golden syrup in a large
        microwave-safe bowl for 40 to 50 seconds on high, then add the remaining ingredients
        as above.</p>\n</div>\n\n  \n</li>\n          \n            \n\n<li>\n  \n
        \   <p data-block-key=\"dx8y3\">Add the beaten egg and mix well again.</p>\n
        \ \n</li>\n          \n            \n\n<li>\n  \n    <p data-block-key=\"h6lfa\">Tip
        the mixture into the prepared tin and level the surface. Bake for 20 to 25
        minutes until firm.</p>\n  \n</li>\n          \n            \n\n<li>\n  \n
        \   <p data-block-key=\"h6lfa\">Cool in the tin for about 20 minutes, then
        cut into 16 squares.</p>\n  \n    <div class=\"nhsuk-inset-text\">\n  <span
        class=\"nhsuk-u-visually-hidden\">Information: </span>\n  <p data-block-key=\"a5ayn\">Store
        in an airtight container for up to a week, or freeze for up to 3 months.</p>\n</div>\n\n
        \ \n</li>\n          \n        </ol>\n      </div>\n    </div>\n  </div>\n</div>\n\n\n<script
