        class=\"nhsuk-grid-row bh-recipe nhsuk-u-padding-bottom-0\">\n  <div class=\"nhsuk-grid-column-two-thirds\">\n
        \   <h1>Apple, apricot and sultana squares recipe</h1>\n      <div class=\"bh-recipe__description\"><p
        data-block-key=\"mee6e\">Perfect for packed lunches and picnics, and a tasty
        treat with a cup of tea too!</p><p data-block-key=\"zaeom\">Prep: 15 mins<br/>Cook:
        20 mins<br/>Makes 16 squares</p></div>\n      <div class=\"bh-recipe__details\">\n
        \       \n        \n          <details class=\"nhsuk-details nhsuk-expander\">\n
        \           <summary class=\"nhsuk-details__summary\">\n              <span
        class=\"nhsuk-details__summary-text\">\n              Nutritional information\n
        \             </span>\n            </summary>\n            <div class=\"nhsuk-details__text\">\n
        \             \n                \n                  <p data-block-key=\"m3xl8\">Per
        square:</p><ul><li data-block-key=\"uqy1j\">560kJ / 134kcal</li><li data-block-key=\"dcii4\">2.5g
        protein</li><li data-block-key=\"2lb0\">17.9g carbohydrate, of which 7.5g
        sugars</li><li data-block-key=\"2mosd\">5.4g fat, of which 1.9g saturates</li><li
        data-block-key=\"ej4nb\">1.7g fibre</li><li data-block-key=\"988i4\">0.1g
        salt</li></ul>\n                \n              \n            </div>\n          </details>\n
        \       \n      </div>\n  </div>\n  <div class=\"nhsuk-grid-column-one-third
        bh-recipe__image\">\n    <figure class=\"nhsuk-image\">\n      <img\n        class=\"nhsuk-image__img\"\n
        \       src=\"https://assets.nhs.uk/campaigns-cms-prod/images/Apple_apricot__sultana_squares_7ubq6ki.width-320.png\"\n
        \       sizes=\"\n          (min-width: 1020px) 320px,\n          (min-width:
        768px) 50vw,\n          100vw\n        \"\n        srcset=\"\n          https://assets.nhs.uk/campaigns-cms-prod/images/Apple_apricot__sultana_squares_7ubq6ki.width-320.png
        320w,\n          https://assets.nhs.uk/campaigns-cms-prod/images/Apple_apricot__sultana_squares_7ubq6ki.width-510.png
